services:
  bot:
    build: .
    pull_policy: build
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      DEV_GUILD_ID: ${DEV_GUILD_ID}
      BOT_OWNER_IDS: ${BOT_OWNER_IDS}
      PREFIX_DEFAULT: ${PREFIX_DEFAULT}

      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      MONGODB_URI: ${MONGODB_URI}
